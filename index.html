<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A curated live feed of data engineering, lakehouse, and infrastructure news.">
  <meta name="theme-color" content="#0b1220">
  <title>Data Engineering Daily</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    :root { color-scheme: light; --bg-color:#f4f6f8; --card-bg:#fff; --text-main:#1e293b; --text-muted:#64748b; --accent:#2563eb; --accent-hover:#1d4ed8; --border:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif; background:var(--bg-color); color:var(--text-main); line-height:1.6; padding:32px 16px; }
    .container { max-width:900px; margin:0 auto; }
    header { margin-bottom:32px; text-align:center; }
    header h1 { font-size:clamp(1.8rem,4vw,2.4rem); font-weight:800; letter-spacing:-.035em; color:#0f172a; }
    header p { color:var(--text-muted); font-size:1rem; margin-top:8px; }
    .feed-grid { display:grid; gap:16px; }
    .card { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.05); transition:transform .15s ease,box-shadow .15s ease; }
    .card:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .badge { display:inline-block; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); background:#eff6ff; padding:4px 8px; border-radius:4px; margin-bottom:12px; }
    .card h2 { font-size:1.12rem; font-weight:700; line-height:1.4; margin-bottom:8px; color:#0f172a; }
    .card p { font-size:.925rem; color:var(--text-muted); margin-bottom:14px; overflow-wrap:anywhere; }
    .card a { display:inline-flex; align-items:center; gap:4px; font-size:.875rem; font-weight:600; color:var(--accent); text-decoration:none; }
    .card a:hover { color:var(--accent-hover); text-decoration:underline; }
    .status-msg { text-align:center; padding:40px 20px; color:var(--text-muted); }
    .error-box { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; padding:16px; border-radius:8px; text-align:center; }
    .feed-meta { text-align:center; color:var(--text-muted); font-size:.8rem; margin:0 0 16px; }
    .retry { display:inline-block; margin-top:12px; padding:8px 14px; border:0; border-radius:7px; background:var(--accent); color:white; cursor:pointer; font:inherit; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Data Engineering Daily</h1>
      <p>Data engineering, lakehouse, streaming, and infrastructure news in one place.</p>
    </header>
    <main id="news-container" aria-live="polite"><div class="status-msg">Loading latest articles…</div></main>
  </div>
  <script>
    "use strict";
    const FEEDS = [
      { name:"NYT Tech", url:"https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml" },
      { name:"Reddit DataEngineering", url:"https://www.reddit.com/r/dataengineering/.rss" },
      { name:"Reddit ApacheKafka", url:"https://www.reddit.com/r/apachekafka/.rss" },
      { name:"Reddit BigData", url:"https://www.reddit.com/r/bigdata/.rss" },
      { name:"Hacker News", url:"https://news.ycombinator.com/rss" },
      { name:"GitHub Blog", url:"https://github.blog/feed/" }
    ];
    const container = document.getElementById("news-container");

    function cleanText(markup, maxLength=240) {
      if (!markup) return "";
      const doc = new DOMParser().parseFromString(String(markup), "text/html");
      const text = (doc.body.textContent || "").replace(/\s+/g," ").trim();
      return text.length > maxLength ? text.slice(0,maxLength).trimEnd()+"…" : text;
    }

    async function getText(url, timeoutMs=12000) {
      const controller = new AbortController();
      const timer = setTimeout(()=>controller.abort(),timeoutMs);
      try {
        const response = await fetch(url,{signal:controller.signal,credentials:"omit"});
        if (!response.ok) throw new Error("HTTP "+response.status);
        return await response.text();
      } finally { clearTimeout(timer); }
    }

    function normalizeXml(xmlText, source) {
      const xml = new DOMParser().parseFromString(xmlText,"application/xml");
      if (xml.querySelector("parsererror")) throw new Error("Proxy did not return valid XML");
      return [...xml.querySelectorAll("item, entry")].map(node => {
        const title = node.querySelector("title")?.textContent?.trim() || "Untitled article";
        const linkNode = node.querySelector('link[rel="alternate"]') || node.querySelector("link");
        const link = linkNode?.getAttribute("href") || linkNode?.textContent?.trim() || "";
        const description = node.querySelector("description, summary, content, encoded")?.textContent || "";
        const date = node.querySelector("pubDate, published, updated, date")?.textContent || "";
        return {title,link,description,pubDate:date,categoryName:source.name};
      }).filter(a => {
        try { return a.link && ["https:","http:"].includes(new URL(a.link).protocol); }
        catch { return false; }
      });
    }

    async function fetchAndParseRSS(source) {
      // Use independent providers. Public feeds often block direct browser requests,
      // so the page must use a CORS-enabled fetch service.
      const attempts = [
        async () => {
          const endpoint = "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(source.url);
          const data = JSON.parse(await getText(endpoint));
          if (data.status !== "ok" || !Array.isArray(data.items)) throw new Error(data.message || "RSS-to-JSON unavailable");
          return data.items.map(item => ({
            title:item.title || "Untitled article",
            link:item.link || "",
            description:item.description || item.content || "",
            pubDate:item.pubDate || "",
            categoryName:source.name
          })).filter(a => {
            try { return a.link && ["https:","http:"].includes(new URL(a.link).protocol); }
            catch { return false; }
          });
        },
        async () => normalizeXml(await getText("https://proxy.cors.dev/"+source.url),source),
        async () => normalizeXml(await getText("https://api.allorigins.win/raw?url="+encodeURIComponent(source.url)),source),
        async () => normalizeXml(await getText("https://corsproxy.io/?url="+encodeURIComponent(source.url)),source)
      ];
      for (const attempt of attempts) {
        try {
          const articles = await attempt();
          if (articles.length) return articles;
        } catch (error) {
          console.warn("Feed provider failed for "+source.name,error);
        }
      }
      return [];
    }

    function renderArticles(articles, failedFeeds) {
      container.replaceChildren();
      if (!articles.length) {
        const error = document.createElement("div");
        error.className="error-box";
        error.textContent="Live feeds are temporarily unavailable. You can still open the source feeds directly below, or retry loading.";
        container.append(error);
        const links = document.createElement("div");
        links.className="feed-grid";
        for (const feed of FEEDS) {
          const card=document.createElement("article"); card.className="card";
          const heading=document.createElement("h2"); heading.textContent=feed.name;
          const anchor=document.createElement("a"); anchor.href=feed.url; anchor.target="_blank"; anchor.rel="noopener noreferrer"; anchor.textContent="Open source feed →";
          card.append(heading,anchor); links.append(card);
        }
        const retry=document.createElement("button"); retry.className="retry"; retry.textContent="Retry loading"; retry.addEventListener("click",loadNews);
        container.append(links,retry);
        return;
      }
      const meta=document.createElement("p"); meta.className="feed-meta";
      meta.textContent=articles.length+" articles loaded"+(failedFeeds.length?" · Unavailable feeds: "+failedFeeds.join(", "):"");
      container.append(meta);
      const grid=document.createElement("div"); grid.className="feed-grid";
      for (const article of articles) {
        const card=document.createElement("article"); card.className="card";
        const badge=document.createElement("span"); badge.className="badge"; badge.textContent=article.categoryName;
        const heading=document.createElement("h2"); heading.textContent=article.title;
        const description=document.createElement("p"); description.textContent=cleanText(article.description)||"Open the original source to read the full story.";
        const link=document.createElement("a"); link.href=article.link; link.target="_blank"; link.rel="noopener noreferrer"; link.textContent="Read article →";
        card.append(badge,heading,description,link); grid.append(card);
      }
      container.append(grid);
    }

    async function loadNews() {
      container.innerHTML='<div class="status-msg">Loading latest articles…</div>';
      const results=await Promise.all(FEEDS.map(async feed=>({feed,articles:await fetchAndParseRSS(feed)})));
      const allArticles=results.flatMap(result=>result.articles);
      const failedFeeds=results.filter(result=>!result.articles.length).map(result=>result.feed.name);
      allArticles.sort((a,b)=>(Date.parse(b.pubDate)||0)-(Date.parse(a.pubDate)||0));
      renderArticles(allArticles,failedFeeds);
    }
    loadNews().catch(error=>{
      console.error("Unable to load news:",error);
      container.innerHTML='<div class="error-box">Could not load live news right now. Please try again.<br><button class="retry" onclick="location.reload()">Retry loading</button></div>';
    });
  </script>
</body>
</html>
